services:
  mysql:
    image: mysql:8.4.13
    container_name: quan-net-btl2-mysql
    ports:
      - "127.0.0.1:${DB_PORT:-13307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in local .env}
    volumes:
      - quan_net_backend_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent']
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  quan_net_backend_mysql:
